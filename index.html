<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lavagna">
<meta name="theme-color" content="#14181f">
<title>Lavagna Pallavolo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #14181f;
    --bar: #1d232d;
    --btn: #2a323f;
    --btn-on: #f2f4f7;
    --txt: #e9edf2;
    --txt-dim: #9aa5b4;
    --accent: #ff7a2f;
    --line: #333c4a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 10px; background: var(--bar); flex: none;
  }
  .bar::-webkit-scrollbar { display: none; }
  .bar.top { border-bottom: 1px solid var(--line); }
  .bar.bottom { border-top: 1px solid var(--line); }
  .group { display: flex; align-items: center; gap: 5px; flex: none; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; flex: none; }
  .spacer { flex: 1 0 4px; }
  .lbl { color: var(--txt-dim); font-size: 13px; font-weight: 600; margin: 0 2px 0 4px; white-space: nowrap; }
  button {
    font: inherit; color: var(--txt); background: var(--btn); border: 0; border-radius: 10px;
    min-width: 44px; height: 44px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; flex: none; white-space: nowrap; touch-action: manipulation;
  }
  button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button.on { background: var(--btn-on); color: #111; }
  button:active { transform: scale(.94); }
  button:disabled { opacity: .35; }
  button.add { font-weight: 600; padding: 0 12px 0 8px; }
  button.add svg.fig { fill: currentColor; stroke: #fff; stroke-width: 1.4; width: 24px; height: 24px; }
  button.add span { color: var(--txt); }
  .sw {
    width: 34px; height: 34px; min-width: 34px; border-radius: 50%; padding: 0;
    border: 3px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--bar), 0 0 0 4px var(--accent); }
  .custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .custom input { position: absolute; inset: -10px; opacity: 0; width: 60px; height: 60px; cursor: pointer; }
  .size { min-width: 40px; }
  .size i { display: block; background: currentColor; border-radius: 50%; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  /* finestre */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  .modal.open { display: flex; }
  .sheet {
    background: var(--bar); border-radius: 16px; width: min(520px, 100%); max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .sheet h2 { margin: 0; padding: 16px 18px 10px; font-size: 18px; }
  .sheet .list { overflow-y: auto; padding: 0 12px 8px; -webkit-user-select: none; }
  .sheet .row { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .sheet .row .name { flex: 1; min-width: 0; }
  .sheet .row .name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .row .name small { color: var(--txt-dim); }
  .sheet .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px 16px; }
  .sheet input[type=text] {
    width: 100%; font: inherit; font-size: 17px; color: var(--txt); background: var(--btn); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; -webkit-user-select: text; user-select: text;
  }
  .sheet .body { padding: 4px 18px 0; }
  .rotrow { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  .rotrow input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent); height: 44px; }
  .rotval { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--txt-dim); }
  .poses { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 14px; }
  .pose { flex-direction: column; height: auto; padding: 6px 2px 8px; gap: 2px; background: #c8743a; border: 3px solid transparent; }
  .pose canvas { width: 100%; max-width: 72px; height: auto; }
  .pose span { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .pose.on { background: #c8743a; border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .empty { color: var(--txt-dim); padding: 18px 6px; text-align: center; }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.danger { background: #4a2328; color: #ff9a9a; }
  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(20,24,31,.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="bar top">
    <div class="group" id="tools">
      <button data-tool="move" title="Sposta" class="on"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5m0-1V3.5a1.5 1.5 0 0 1 3 0V10m0-4.5a1.5 1.5 0 0 1 3 0V13a7 7 0 0 1-7 7h-1a6 6 0 0 1-4.6-2.2L3 14.5a1.6 1.6 0 0 1 2.4-2.1L9 15"/></svg></button>
      <button data-tool="pen" title="Penna"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
      <button data-tool="arrow" title="Freccia"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
      <button data-tool="dash" title="Freccia tratteggiata"><svg viewBox="0 0 24 24"><path d="M5 19l2.5-2.5M10 14l2.5-2.5M15 9l4-4M11 5h8v8"/></svg></button>
      <button data-tool="curve" title="Freccia a mano libera"><svg viewBox="0 0 24 24"><path d="M4 18c3-9 9 2 12-7l2-5"/><path d="M14 7l4-1 1 4"/></svg></button>
      <button data-tool="hl" title="Evidenziatore"><svg viewBox="0 0 24 24"><path d="M9 14l-3 3v3h3l3-3"/><path d="M9 14l7-9 4 4-9 7z"/></svg></button>
      <button data-tool="erase" title="Gomma"><svg viewBox="0 0 24 24"><path d="M7 20h12"/><path d="M4.5 13.5l9-9a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 18H8z"/><path d="M9 9l6 6"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="group" id="colors"></div>
    <div class="sep"></div>
    <div class="group" id="sizes"></div>
    <div class="spacer"></div>
    <div class="group">
      <button id="undo" title="Annulla"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="redo" title="Ripeti"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button id="clearDraw" title="Cancella i disegni"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </div>

  <div id="stage"><canvas id="cv"></canvas></div>

  <div class="bar bottom">
    <div class="group">
      <button class="add" data-add="A" title="Aggiungi un giocatore rosso"><svg viewBox="0 0 24 24" class="fig" style="color:#e53935"><circle cx="12" cy="6" r="4"/><path d="M4 22v-6a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v6z"/></svg>+ Rosso</button>
      <button class="add" data-add="B" title="Aggiungi un giocatore blu"><svg viewBox="0 0 24 24" class="fig" style="color:#1e6fd9"><circle cx="12" cy="6" r="4"/><path d="M4 22v-6a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v6z"/></svg>+ Blu</button>
      <button class="add" data-add="L" title="Aggiungi un libero"><svg viewBox="0 0 24 24" class="fig" style="color:#ffd23f"><circle cx="12" cy="6" r="4"/><path d="M4 22v-6a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v6z"/></svg>+ Libero</button>
      <button class="add" data-add="ball" title="Aggiungi un pallone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5c-2 3-2 6 0 8.5s4 5.5 3 8M4 10c3 1 6 1 8 2m0 0c2 1 5 .5 8-1.5"/></svg>+ Palla</button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button id="view" title="Campo intero / metà campo"></button>
      <button id="style" title="Giocatori visti dall'alto o di lato"></button>
      <button id="zones" title="Numeri delle zone">Zone</button>
      <button id="reset" title="Svuota la lavagna (omini e disegni)"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M10 13l5 5M15 13l-5 5"/></svg>Svuota</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="save" title="Salva schema"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Salva</button>
      <button id="open" title="Schemi salvati"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Schemi</button>
      <button id="export" title="Esporta immagine"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6h14v-6"/></svg></button>
    </div>
  </div>
</div>

<div class="modal" id="mSchemi">
  <div class="sheet">
    <h2>Schemi salvati</h2>
    <div class="list" id="schemiList"></div>
    <div class="foot"><button data-close>Chiudi</button></div>
  </div>
</div>

<div class="modal" id="mPlayer">
  <div class="sheet">
    <h2>Giocatore</h2>
    <div class="body">
      <input type="text" id="pInput" maxlength="12" autocomplete="off" placeholder="Numero o nome">
      <div class="rotrow">
        <span class="lbl">Rotazione</span>
        <button data-rot="-45" title="Ruota a sinistra">↺</button>
        <input type="range" id="pRot" min="-180" max="180" step="5" value="0">
        <button data-rot="45" title="Ruota a destra">↻</button>
        <span id="pRotVal" class="rotval">0°</span>
        <button data-rot="0" title="Rimetti dritto">0°</button>
      </div>
      <div class="poses" id="poses"></div>
    </div>
    <div class="foot"><button data-close>Annulla</button><button class="primary" id="pOk">OK</button></div>
  </div>
</div>

<div class="modal" id="mText">
  <div class="sheet">
    <h2 id="tTitle"></h2>
    <div class="body"><input type="text" id="tInput" maxlength="40" autocomplete="off"></div>
    <div class="foot"><button data-close>Annulla</button><button class="primary" id="tOk">OK</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

// ---------- Costanti del campo (in metri) ----------
// Campo 18 x 9. x = lunghezza (rete a x=9), y = larghezza. Rossi a sinistra (x 0-9), Blu a destra.
const VIEWS = {
  full: { x0: -0.9, x1: 18.9, y0: -0.75, y1: 9.75 },
  half: { x0: -0.9, x1: 9.9, y0: -0.75, y1: 9.75 }
};
const TEAM = {
  A: { fill: '#e53935', text: '#fff', lib: '#ffd23f', libText: '#222' },
  B: { fill: '#1e6fd9', text: '#fff', lib: '#3fd17a', libText: '#0d2a18' }
};
const COLORS = ['#ffffff', '#111111', '#ffeb3b', '#ff9800', '#f44336', '#e91e63', '#9c27b0', '#2979ff', '#00e5ff', '#4caf50', '#76ff03'];
const SIZES = [3, 6, 10];

// Posizioni di zona per i Rossi (guardano verso la rete, a destra)
const ZONE_A = {
  1: [2.0, 7.5], 2: [7.2, 7.5], 3: [7.2, 4.5], 4: [7.2, 1.5], 5: [2.0, 1.5], 6: [2.0, 4.5]
};
const mirror = ([x, y]) => [18 - x, 9 - y];

// ---------- Stato ----------
const LS_BOARD = 'lavagnaVolley.board';
const LS_SCHEMI = 'lavagnaVolley.schemi';
const LS_PREFS = 'lavagnaVolley.prefs';

let prefs = { view: 'full', zones: true, style: 'top', tool: 'move', color: '#ffeb3b', size: 1 };
let board;           // { tokens, strokes, rotA, rotB }
let history = [], hIndex = -1;

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

function rotPos(team, rot, i) {
  // giocatore i (1..6) nella rotazione rot (1..6): in rotazione 1 il n.1 e' in zona 1
  const zone = ((i - rot) % 6 + 6) % 6 + 1;
  const p = ZONE_A[zone];
  return team === 'A' ? p.slice() : mirror(p);
}

// la lavagna parte sempre vuota
function defaultBoard() { return { tokens: [], strokes: [] }; }
// la lavagna in corso sopravvive solo a un ricaricamento della pagina, non a una nuova apertura
function ssGet(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

function snapshot() { return JSON.stringify(board); }
function commit() {
  history = history.slice(0, hIndex + 1);
  history.push(snapshot());
  if (history.length > 120) history.shift();
  hIndex = history.length - 1;
  ssSet(LS_BOARD, board);
  updateButtons();
}
function restore(json) { board = JSON.parse(json); ssSet(LS_BOARD, board); updateButtons(); draw(); }

// ---------- Canvas e trasformazioni ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, vertical = false, V = VIEWS.full;

function layout() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  V = VIEWS[prefs.view];
  const vw = V.x1 - V.x0, vh = V.y1 - V.y0;
  // In verticale (iPad in piedi) ruotiamo il campo se cosi' viene piu' grande
  const sH = Math.min(W / vw, H / vh), sV = Math.min(W / vh, H / vw);
  vertical = sV > sH * 1.08;
  S = vertical ? sV : sH;
  const cw = (vertical ? vh : vw) * S, ch = (vertical ? vw : vh) * S;
  OX = (W - cw) / 2; OY = (H - ch) / 2;
  draw();
}
function toScreen(x, y) {
  return vertical ? [OX + (y - V.y0) * S, OY + (V.x1 - x) * S] : [OX + (x - V.x0) * S, OY + (y - V.y0) * S];
}
function toWorld(sx, sy) {
  return vertical ? [V.x1 - (sy - OY) / S, V.y0 + (sx - OX) / S] : [V.x0 + (sx - OX) / S, V.y0 + (sy - OY) / S];
}
function figH() { return Math.max(78, Math.min(150, 1.95 * S)); } // altezza del giocatore in px
function ballR() { return Math.max(13, Math.min(28, 0.34 * S)); }

// ---------- Disegno ----------
function rectW(x0, y0, x1, y1) {
  const [a, b] = toScreen(x0, y0), [c, d] = toScreen(x1, y1);
  return [Math.min(a, c), Math.min(b, d), Math.abs(c - a), Math.abs(d - b)];
}
function lineW(x0, y0, x1, y1) {
  const [a, b] = toScreen(x0, y0), [c, d] = toScreen(x1, y1);
  ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
}

function drawCourt() {
  // sfondo
  ctx.fillStyle = '#0f1318'; ctx.fillRect(0, 0, W, H);
  // zona libera
  ctx.fillStyle = '#1b7a8c';
  ctx.fillRect(...rectW(V.x0, V.y0, V.x1, V.y1));
  // campo
  ctx.fillStyle = '#e07b39';
  ctx.fillRect(...rectW(0, 0, 18, 9));
  // zona d'attacco un po' piu' scura
  ctx.fillStyle = 'rgba(0,0,0,.07)';
  ctx.fillRect(...rectW(6, 0, 12, 9));

  const lw = Math.max(2, 0.06 * S);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = lw; ctx.lineCap = 'butt';
  ctx.strokeRect(...rectW(0, 0, 18, 9));
  lineW(9, 0, 9, 9);
  lineW(6, 0, 6, 9); lineW(12, 0, 12, 9);
  // prolungamenti tratteggiati delle linee d'attacco
  ctx.setLineDash([0.15 * S, 0.2 * S]);
  const ext0 = V.y0 + 0.1, ext1 = V.y1 - 0.1;
  lineW(6, 0, 6, ext0); lineW(6, 9, 6, ext1);
  if (prefs.view === 'full') { lineW(12, 0, 12, ext0); lineW(12, 9, 12, ext1); }
  ctx.setLineDash([]);

  // numeri delle zone
  if (prefs.zones) {
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.font = `700 ${Math.round(0.8 * S)}px -apple-system, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // nell'angolo di ogni zona, cosi' non finiscono sotto gli omini
    const zcA = { 1: [4.6, 8.2], 2: [8.3, 8.4], 3: [8.3, 5.4], 4: [8.3, 2.4], 5: [4.6, 2.2], 6: [4.6, 5.2] };
    for (const z in zcA) {
      let [x, y] = zcA[z];
      ctx.fillText(z, ...toScreen(x, y));
      if (prefs.view === 'full') ctx.fillText(z, ...toScreen(...mirror([x, y])));
    }
  }

  // rete e pali
  const [n0x, n0y] = toScreen(9, -0.5), [n1x, n1y] = toScreen(9, 9.5);
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(6, 0.22 * S); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(n0x + 2, n0y + 2); ctx.lineTo(n1x + 2, n1y + 2); ctx.stroke();
  ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = Math.max(4, 0.14 * S);
  ctx.beginPath(); ctx.moveTo(n0x, n0y); ctx.lineTo(n1x, n1y); ctx.stroke();
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(1.5, 0.05 * S); ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(n0x, n0y); ctx.lineTo(n1x, n1y); ctx.stroke();
  ctx.setLineDash([]);
  // antenne
  ctx.strokeStyle = '#e53935'; ctx.lineWidth = Math.max(3, 0.1 * S);
  for (const y of [0, 9]) {
    const [ax, ay] = toScreen(9, y);
    ctx.beginPath(); ctx.arc(ax, ay, Math.max(3, 0.12 * S), 0, Math.PI * 2); ctx.stroke();
  }
  for (const [px, py] of [[n0x, n0y], [n1x, n1y]]) {
    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(px, py, Math.max(5, 0.2 * S), 0, Math.PI * 2); ctx.fill();
  }
}

function arrowHead(x0, y0, x1, y1, size, color) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - size * Math.cos(a - 0.45), y1 - size * Math.sin(a - 0.45));
  ctx.lineTo(x1 - size * Math.cos(a + 0.45), y1 - size * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}

function drawStroke(s) {
  const pts = s.pts.map(p => toScreen(p[0], p[1]));
  if (!pts.length) return;
  const w = Math.max(1.5, s.w * S);
  ctx.save();
  ctx.strokeStyle = s.color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = w;
  if (s.tool === 'hl') { ctx.globalAlpha = 0.38; ctx.lineWidth = w * 3.2; }
  const head = Math.max(12, w * 3.4);

  if (s.tool === 'arrow' || s.tool === 'dash') {
    const [a, b] = pts[0], [c, d] = pts[pts.length - 1];
    const len = Math.hypot(c - a, d - b);
    if (len < 4) { ctx.restore(); return; }
    const k = (len - head * 0.8) / len;
    if (s.tool === 'dash') ctx.setLineDash([w * 2.4, w * 2.2]);
    ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(a + (c - a) * k, b + (d - b) * k); ctx.stroke();
    ctx.setLineDash([]);
    arrowHead(a, b, c, d, head, s.color);
  } else {
    if (s.dash) ctx.setLineDash([w * 2.4, w * 2.2]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    if (pts.length === 1) ctx.lineTo(pts[0][0] + 0.1, pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    if (pts.length > 1) ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    ctx.stroke();
    ctx.setLineDash([]);
    if (s.tool === 'curve' && pts.length > 2) {
      // direzione della punta: un punto un po' indietro lungo il tratto
      const end = pts[pts.length - 1];
      let j = pts.length - 2;
      while (j > 0 && Math.hypot(end[0] - pts[j][0], end[1] - pts[j][1]) < head) j--;
      arrowHead(pts[j][0], pts[j][1], end[0], end[1], head, s.color);
    }
  }
  ctx.restore();
}

// ---------- Giocatori: sagome con proporzioni reali ----------
// Unita': altezza ~100. Piedi a terra y=0, y negativa verso l'alto, il giocatore guarda a destra (+x).
// Ogni posa indica bacino, inclinazione del busto e dove stanno caviglie e mani:
// gomiti e ginocchia si calcolano da soli con lunghezze reali degli arti.
const LEN = { thigh: 25, shin: 24, upper: 17, fore: 15, torso: 30 };
const POSES = {
  ready:  { name: 'Ricezione', lift: 0,  hip: [-6, -37], lean: 38, head: 22, aN: [11, -3], aF: [-12, -3], hN: [35, -42], hF: [34, -43], eN: 1, eF: 1 },
  dig:    { name: 'Difesa',    lift: 0,  hip: [-12, -24], lean: 52, head: 35, aN: [16, -3], aF: [-20, -3], hN: [33, -21], hF: [32, -22], eN: 1, eF: 1 },
  set:    { name: 'Palleggio', lift: 0,  hip: [-1, -48], lean: 4, head: 2, aN: [9, -3], aF: [-7, -3], hN: [13, -104], hF: [10, -105], eN: 1, eF: 1 },
  attack: { name: 'Attacco',   lift: 20, hip: [-3, -50], lean: -9, head: -4, aN: [-12, -14], aF: [-20, -21], hN: [-2, -110], hF: [21, -93], eN: -1, eF: -1 },
  block:  { name: 'Muro',      lift: 12, hip: [0, -50], lean: 3, head: 0, aN: [3, -3], aF: [-3, -3], hN: [9, -112], hF: [5, -112], eN: -1, eF: -1 },
  serve:  { name: 'Battuta',   lift: 0,  hip: [-2, -49], lean: 4, head: 4, aN: [11, -3], aF: [-11, -3], hN: [-6, -106], hF: [17, -101], eN: -1, eF: 1 }
};
const POSE_KEYS = Object.keys(POSES);

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
// cinematica inversa a due segmenti
function ik(A, C, l1, l2, s) {
  let dx = C[0] - A[0], dy = C[1] - A[1], d = Math.hypot(dx, dy);
  const max = l1 + l2 - 0.01;
  if (d > max) { dx *= max / d; dy *= max / d; d = max; }
  const base = Math.atan2(dy, dx);
  const a = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const J = [A[0] + l1 * Math.cos(base + s * a), A[1] + l1 * Math.sin(base + s * a)];
  return [J, [A[0] + dx, A[1] + dy]];
}
// capsula rastremata (raggio ra in a, rb in b)
function cap(p, a, ra, b, rb) {
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
  if (d < 0.01) { p.moveTo(a[0] + ra, a[1]); p.arc(a[0], a[1], ra, 0, Math.PI * 2); return; }
  const ang = Math.atan2(dy, dx), phi = Math.acos(Math.max(-1, Math.min(1, (ra - rb) / d)));
  p.moveTo(a[0] + ra * Math.cos(ang + phi), a[1] + ra * Math.sin(ang + phi));
  p.arc(a[0], a[1], ra, ang + phi, ang + 2 * Math.PI - phi);
  p.arc(b[0], b[1], rb, ang - phi, ang + phi);
  p.closePath();
}

function buildBody(P) {
  const hip = P.hip, L = (P.lean * Math.PI) / 180;
  const up = [Math.sin(L), -Math.cos(L)], side = [-up[1], up[0]]; // side = verso la pancia
  const sh = [hip[0] + up[0] * LEN.torso, hip[1] + up[1] * LEN.torso];
  const H = ((P.lean - P.head) * Math.PI) / 180; // la testa resta piu' dritta del busto
  const hu = [Math.sin(H), -Math.cos(H)];
  const neck = [sh[0] + up[0] * 2.5, sh[1] + up[1] * 2.5];
  const head = [neck[0] + hu[0] * 8.5 + 1.2, neck[1] + hu[1] * 8.5];

  const legs = {}, arms = {};
  for (const k of ['N', 'F']) {
    const hp = k === 'N' ? [hip[0] + side[0] * 0.8, hip[1]] : [hip[0] - side[0] * 0.8, hip[1]];
    const [knee, ank] = ik(hp, P['a' + k], LEN.thigh, LEN.shin, -1);
    legs[k] = { hip: hp, knee, ank };
    const s0 = k === 'N' ? sh : [sh[0] - side[0] * 1.5, sh[1] - side[1] * 1.5];
    const [elb, wr] = ik(s0, P['h' + k], LEN.upper, LEN.fore, P['e' + k]);
    arms[k] = { sh: s0, elb, wr };
  }
  return { hip, sh, up, side, neck, head, H, legs, arms };
}

function bodyPaths(B) {
  const far = new Path2D(), near = new Path2D(), shortsN = new Path2D(), shortsF = new Path2D(), shoes = new Path2D(), torso = new Path2D();
  function leg(p, sp, l) {
    cap(p, l.hip, 6.3, l.knee, 4.2);
    const calf = lerp(l.knee, l.ank, 0.33);
    cap(p, l.knee, 4.2, calf, 4.4);
    cap(p, calf, 4.4, l.ank, 2.3);
    cap(sp, l.hip, 7.2, lerp(l.hip, l.knee, 0.42), 5.9);
    const toe = [l.ank[0] + 8.5, l.ank[1] + 1.6];
    cap(shoes, [l.ank[0] - 1.2, l.ank[1] + 1.0], 2.2, toe, 1.5);
  }
  function arm(p, a) {
    cap(p, a.sh, 4.6, a.elb, 3.3);
    const fa = lerp(a.elb, a.wr, 0.3);
    cap(p, a.elb, 3.3, fa, 3.6);
    cap(p, fa, 3.6, a.wr, 2.2);
    const dir = [(a.wr[0] - a.elb[0]) / LEN.fore, (a.wr[1] - a.elb[1]) / LEN.fore];
    cap(p, a.wr, 2.3, [a.wr[0] + dir[0] * 4.6, a.wr[1] + dir[1] * 4.6], 1.9);
  }
  leg(far, shortsF, B.legs.F);
  arm(far, B.arms.F);
  // busto: spalle larghe, vita stretta
  const u = B.up, s = B.side, at = (t, w) => [B.hip[0] + u[0] * LEN.torso * t + s[0] * w, B.hip[1] + u[1] * LEN.torso * t + s[1] * w];
  const pts = [at(1.02, -6.5), at(0.98, 7), at(0.75, 8.8), at(0.45, 6.6), at(0.12, 7), at(-0.05, 6.4), at(-0.05, -7.4), at(0.12, -7.6), at(0.45, -6.4), at(0.8, -7.5)];
  torso.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
  for (let i = 1; i <= pts.length; i++) {
    const p1 = pts[i % pts.length], p2 = pts[(i + 1) % pts.length];
    torso.quadraticCurveTo(p1[0], p1[1], (p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2);
  }
  torso.closePath();
  cap(near, B.neck, 3.3, lerp(B.neck, B.head, 0.55), 3.0);
  near.moveTo(B.head[0] + 6.4, B.head[1]);
  near.ellipse(B.head[0], B.head[1], 6.1, 7.3, -(B.H) * 0.6, 0, Math.PI * 2);
  leg(near, shortsN, B.legs.N);
  const nearArm = new Path2D(); arm(nearArm, B.arms.N);
  return { far, near, nearArm, torso, shortsN, shortsF, shoes };
}

// disegna un giocatore con i piedi in (x,y), alto h pixel
function drawPlayer(c, x, y, h, o) {
  const P = POSES[o.pose] || POSES.ready;
  const k = h / 100, dir = o.mirror ? -1 : 1;
  const B = buildBody(P), D = bodyPaths(B);
  const main = o.color, dark = shade(o.color, -0.3), shorts = shade(o.color, -0.62), shortsD = shade(o.color, -0.72);
  c.save();
  c.translate(x, y);
  c.fillStyle = 'rgba(0,0,0,' + (P.lift ? .2 : .3) + ')';
  c.beginPath(); c.ellipse(0, 0, 19 * k, 4.5 * k, 0, 0, Math.PI * 2); c.fill();
  c.translate(0, -P.lift * k);
  c.scale(dir * k, k);
  c.lineJoin = 'round';
  // contorno bianco unico attorno a tutta la sagoma
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 2.6;
  for (const p of [D.far, D.near, D.nearArm, D.torso, D.shoes]) c.stroke(p);
  c.fillStyle = dark; c.fill(D.far);
  c.fillStyle = shortsD; c.fill(D.shortsF);
  c.fillStyle = '#d8d8d8'; c.fill(D.shoes);
  c.fillStyle = main; c.fill(D.near);
  c.fillStyle = shorts; c.fill(D.shortsN);
  const g = c.createLinearGradient(B.hip[0] - B.side[0] * 9, B.hip[1] - B.side[1] * 9, B.hip[0] + B.side[0] * 9, B.hip[1] + B.side[1] * 9);
  g.addColorStop(0, shade(o.color, -0.18)); g.addColorStop(0.6, main); g.addColorStop(1, shade(o.color, 0.14));
  c.fillStyle = g; c.fill(D.torso);
  c.fillStyle = '#f4f4f4'; c.fill(D.shoes);
  c.fillStyle = main; c.fill(D.nearArm);
  c.restore();

  // numero sulla schiena/maglia (mai specchiato)
  const label = (o.label || '').slice(0, 12);
  const tc = [B.hip[0] + B.up[0] * LEN.torso * 0.55, B.hip[1] + B.up[1] * LEN.torso * 0.55];
  const cx = x + dir * tc[0] * k, cy = y + (tc[1] - P.lift) * k;
  c.save();
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (label.length && label.length <= 2) {
    c.font = `900 ${Math.round(15 * k)}px -apple-system, system-ui, sans-serif`;
    c.lineWidth = Math.max(2, 2.4 * k); c.strokeStyle = o.textStroke || 'rgba(0,0,0,.5)';
    c.strokeText(label, cx, cy); c.fillStyle = o.text || '#fff'; c.fillText(label, cx, cy);
  } else if (label.length) {
    const fs = Math.max(11, Math.round(10 * k));
    c.font = `700 ${fs}px -apple-system, system-ui, sans-serif`;
    const w = c.measureText(label).width + fs;
    c.fillStyle = 'rgba(15,18,24,.82)';
    c.beginPath(); c.roundRect(x - w / 2, y + 4 * k, w, fs * 1.45, fs * 0.72); c.fill();
    c.fillStyle = '#fff'; c.fillText(label, x, y + 4 * k + fs * 0.75);
  }
  c.restore();
}

// ---------- Giocatori visti dall'alto ----------
// Unita': spalle larghe ~44. Il giocatore guarda verso +x, il suo lato destro e' +y.
const TOP_POSES = {
  ready:  { head: [5, 0],  feet: [[7, 16], [7, -16]], arms: [[[0, 18], [12, 14], [25, 4]], [[0, -18], [12, -14], [25, -4]]] },
  dig:    { head: [9, 0],  feet: [[10, 22], [10, -22]], arms: [[[1, 18], [15, 15], [29, 4]], [[1, -18], [15, -15], [29, -4]]] },
  set:    { head: [3, 0],  feet: [[4, 12], [-6, -12]], arms: [[[0, 18], [9, 19], [15, 7]], [[0, -18], [9, -19], [15, -7]]] },
  attack: { head: [3, 0],  feet: [[-4, 10], [-8, -10]], lift: 1, arms: [[[-2, 18], [-10, 23], [-2, 27]], [[0, -18], [13, -16], [24, -10]]] },
  block:  { head: [3, 0],  feet: [[2, 10], [2, -10]], lift: 1, arms: [[[0, 18], [10, 17], [19, 13]], [[0, -18], [10, -17], [19, -13]]] },
  serve:  { head: [3, 0],  feet: [[6, 13], [-8, -13]], arms: [[[-2, 18], [-11, 22], [-4, 27]], [[0, -18], [12, -15], [22, -7]]] }
};

function drawPlayerTop(c, x, y, w, o) {
  const P = TOP_POSES[o.pose] || TOP_POSES.ready;
  const k = w / 50;
  const ang = (o.angle || 0) * Math.PI / 180;
  const main = o.color, dark = shade(o.color, -0.35), light = shade(o.color, 0.25);
  const skin = '#e3a983', skinD = '#b97d58';
  c.save();
  c.translate(x, y);
  // ombra (spostata se in salto)
  const lift = P.lift ? 1 : 0;
  c.fillStyle = 'rgba(0,0,0,' + (lift ? .18 : .3) + ')';
  c.beginPath(); c.ellipse(3 * k + lift * 5 * k, 4 * k + lift * 7 * k, 24 * k, 24 * k, 0, 0, Math.PI * 2); c.fill();
  c.rotate(ang);
  c.scale(k * (lift ? 1.06 : 1), k * (lift ? 1.06 : 1));
  c.lineCap = 'round'; c.lineJoin = 'round';

  // scarpe
  for (const f of P.feet) {
    c.fillStyle = '#f2f2f2'; c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(f[0], f[1], 6, 3.4, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  // pantaloncini (si vedono dietro il busto)
  c.fillStyle = shade(o.color, -0.65);
  c.beginPath(); c.ellipse(-7, 0, 9, 15, 0, 0, Math.PI * 2); c.fill();

  // braccia: contorno + pelle + manica
  function armPath(a) { c.beginPath(); c.moveTo(a[0][0], a[0][1]); c.lineTo(a[1][0], a[1][1]); c.lineTo(a[2][0], a[2][1]); }
  for (const a of P.arms) { armPath(a); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 9.5; c.stroke(); }
  for (const a of P.arms) {
    armPath(a); c.strokeStyle = skin; c.lineWidth = 7.4; c.stroke();
    c.beginPath(); c.moveTo(a[1][0], a[1][1]); c.lineTo(a[2][0], a[2][1]); c.strokeStyle = skinD; c.lineWidth = 2; c.globalAlpha = .25; c.stroke(); c.globalAlpha = 1;
    c.fillStyle = skin; c.beginPath(); c.arc(a[2][0], a[2][1], 4.3, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 1; c.stroke();
  }
  // busto (maglia) con volume
  const g = c.createRadialGradient(-2, -6, 2, -2, 0, 24);
  g.addColorStop(0, light); g.addColorStop(0.55, main); g.addColorStop(1, dark);
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(-12, -14);
  c.bezierCurveTo(-14, -24, 2, -26, 6, -20);
  c.bezierCurveTo(10, -12, 10, 12, 6, 20);
  c.bezierCurveTo(2, 26, -14, 24, -12, 14);
  c.bezierCurveTo(-15, 6, -15, -6, -12, -14);
  c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.6; c.stroke();
  // maniche
  for (const s of [1, -1]) {
    c.fillStyle = main; c.beginPath(); c.ellipse(0, 18 * s, 6, 5.2, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = dark; c.lineWidth = 1; c.stroke();
  }
  // testa: capelli + orecchie
  const h = P.head;
  c.fillStyle = skin;
  c.beginPath(); c.ellipse(h[0] + 1, h[1] + 7.6, 2, 2.6, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(h[0] + 1, h[1] - 7.6, 2, 2.6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = skin; c.beginPath(); c.ellipse(h[0] + 2.5, h[1], 7, 7.2, 0, 0, Math.PI * 2); c.fill(); // fronte/viso
  const hg = c.createRadialGradient(h[0] - 3, h[1] - 3, 1, h[0] - 1, h[1], 10);
  hg.addColorStop(0, '#6b4a33'); hg.addColorStop(1, '#2a1a10');
  c.fillStyle = hg;
  c.beginPath(); c.ellipse(h[0] - 1, h[1], 8, 7.8, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1; c.stroke();
  c.restore();

  // numero sulla schiena, sempre dritto
  const label = (o.label || '').slice(0, 12);
  const bx = x + Math.cos(ang) * -16 * k, by = y + Math.sin(ang) * -16 * k;
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (label.length && label.length <= 2) {
    const r = 8.5 * k;
    c.fillStyle = main; c.beginPath(); c.arc(bx, by, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = Math.max(1.5, 1.6 * k); c.stroke();
    c.font = `900 ${Math.round(11 * k)}px -apple-system, system-ui, sans-serif`;
    c.fillStyle = o.text || '#fff'; c.fillText(label, bx, by + 0.5);
  } else if (label.length) {
    const fs = Math.max(11, Math.round(9 * k));
    c.font = `700 ${fs}px -apple-system, system-ui, sans-serif`;
    const tw = c.measureText(label).width + fs;
    c.fillStyle = 'rgba(15,18,24,.85)';
    c.beginPath(); c.roundRect(x - tw / 2, y + 27 * k, tw, fs * 1.45, fs * 0.72); c.fill();
    c.fillStyle = '#fff'; c.fillText(label, x, y + 27 * k + fs * 0.75);
  }
  c.restore();
}

function drawToken(t, lifted) {
  const [x, y] = toScreen(t.x, t.y);
  if (t.team === 'ball') { drawBall(x, y, ballR() * (lifted ? 1.12 : 1)); return; }
  const c = TEAM[t.team] || TEAM.A;
  const o = {
    pose: t.pose, label: t.label, mirror: t.team === 'B',
    color: t.lib ? c.lib : c.fill, text: t.lib ? c.libText : c.text,
    textStroke: t.lib ? 'rgba(255,255,255,.6)' : 'rgba(0,0,0,.55)'
  };
  if (prefs.style === 'top') {
    o.angle = topAngle(t);
    drawPlayerTop(ctx, x, y, figW() * (lifted ? 1.08 : 1), o);

  const fh = figH() * (lifted ? 1.08 : 1);
  const rot = (t.rot || 0) * Math.PI / 180;
  if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.translate(-x, -y); }

// direzione sullo schermo del giocatore visto dall'alto: Rossi verso la rete (destra), Blu verso sinistra
function topAngle(t) { return (t.team === 'B' ? 180 : 0) + (t.rot || 0) + (vertical ? -90 : 0); }
function figW() { return Math.max(54, Math.min(110, 1.25 * S)); }

function visibleTokens() {
  return board.tokens.filter(t => t.team !== 'B' || prefs.view === 'full');
}

// cestino: compare in basso mentre trascini un omino
function trashPos() { return [W / 2, H - 46]; }
function drawTrash(hot) {
  const [x, y] = trashPos(), r = hot ? 34 : 28;
  ctx.save();
  ctx.fillStyle = hot ? '#e53935' : 'rgba(20,24,31,.85)';
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const k = r / 28;
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  ctx.moveTo(x - 4 * k, y - 7 * k); ctx.lineTo(x - 4 * k, y - 11 * k); ctx.lineTo(x + 4 * k, y - 11 * k); ctx.lineTo(x + 4 * k, y - 7 * k);
  ctx.moveTo(x - 7.5 * k, y - 7 * k); ctx.lineTo(x - 6 * k, y + 11 * k); ctx.lineTo(x + 6 * k, y + 11 * k); ctx.lineTo(x + 7.5 * k, y - 7 * k);

}

function draw() {
  if (!board) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawCourt();
  for (const s of board.strokes) drawStroke(s);
  for (const a of active.values()) if (a.kind === 'draw') drawStroke(a.stroke);
  const lifted = new Set([...active.values()].filter(a => a.kind === 'drag').map(a => a.token));
  for (const t of visibleTokens()) if (t.team !== 'ball' && !lifted.has(t)) drawToken(t, false);
  for (const t of visibleTokens()) if (t.team === 'ball' && !lifted.has(t)) drawToken(t, false);
  const drags = [...active.values()].filter(a => a.kind === 'drag' && a.moved);
  if (drags.length) drawTrash(drags.some(a => a.overTrash));
  for (const t of lifted) drawToken(t, true);
  // cerchio della gomma
  for (const a of active.values()) if (a.kind === 'erase') {
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1.5;

let raf = 0;
function requestDraw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

// ---------- Interazione ----------
const active = new Map(); // pointerId -> azione
let lastTap = { id: null, time: 0 };

function hitToken(sx, sy, slack) {
  const list = visibleTokens();
  // la palla e' sopra, poi gli altri dall'ultimo
  const ordered = [...list.filter(t => t.team === 'ball'), ...list.filter(t => t.team !== 'ball').reverse()];
  for (const t of ordered) {
    const [x, y] = toScreen(t.x, t.y);
    if (t.team === 'ball') { if (Math.hypot(sx - x, sy - y) <= ballR() + slack) return t; continue; }
    if (prefs.style === 'top') { if (Math.hypot(sx - x, sy - y) <= 0.56 * figW() + slack) return t; continue; }
    const h = figH(), P = POSES[t.pose] || POSES.ready;
    const feet = y + 0.45 * h, top = feet - (1.12 + P.lift / 100) * h;
    if (Math.abs(sx - x) <= 0.3 * h + slack && sy >= top - slack && sy <= feet + 0.06 * h + slack) return t;
  }
  return null;
}
function clampWorld(x, y) {
  return [Math.max(V.x0 + 0.3, Math.min(V.x1 - 0.3, x)), Math.max(V.y0 + 0.3, Math.min(V.y1 - 0.3, y))];
}
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
// Gomma: cancella solo la parte di tratto che tocca, il resto rimane (diviso in pezzi)
const ERASER_PX = 14;
function densify(pts, step) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.ceil(d / step);
    for (let j = 1; j <= n; j++) out.push([a[0] + (b[0] - a[0]) * j / n, a[1] + (b[1] - a[1]) * j / n]);
  }
  return out;
}
function eraseAt(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  let changed = false;
  const result = [];
  for (const s of board.strokes) {
    const straight = s.tool === 'arrow' || s.tool === 'dash';
    const half = s.w * (s.tool === 'hl' ? 1.6 : 0.5);
    const R = ERASER_PX / S + half;
    const base = straight ? [s.pts[0], s.pts[s.pts.length - 1]] : s.pts;
    // controllo veloce: se nessun segmento e' vicino, il tratto resta com'e'
    let near = base.length === 1 ? Math.hypot(wx - base[0][0], wy - base[0][1]) < R : false;
    for (let i = 0; !near && i < base.length - 1; i++) if (distSeg(wx, wy, base[i][0], base[i][1], base[i + 1][0], base[i + 1][1]) < R) near = true;
    if (!near) { result.push(s); continue; }
    changed = true;
    if (base.length === 1) continue;
    const pts = densify(base, Math.max(R / 3, 0.02));
    const hasHead = straight || s.tool === 'curve';
    const dash = s.dash || s.tool === 'dash';
    let run = [];
    const flush = (isEnd) => {
      if (run.length >= 2) {
        const tool = s.tool === 'hl' ? 'hl' : (hasHead && isEnd ? 'curve' : 'pen');
        const piece = { tool, color: s.color, w: s.w, pts: run.map(p => [+p[0].toFixed(3), +p[1].toFixed(3)]) };
        if (dash) piece.dash = true;
        result.push(piece);
      }
      run = [];
    };
    pts.forEach((p, i) => {
      if (Math.hypot(p[0] - wx, p[1] - wy) < R) flush(false);
      else { run.push(p); if (i === pts.length - 1) flush(true); }
    });
  }
  if (changed) board.strokes = result;
  return changed;
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* non critico */ }
  const [sx, sy] = evPos(e);
  const tool = prefs.tool;
  // secondo dito mentre un altro tiene un omino: ruota l'omino
  const holding = [...active.values()].find(a => a.kind === 'drag' && a.token.team !== 'ball');
  if (holding && e.pointerType === 'touch') {
    const ang = Math.atan2(sy - holding.cur[1], sx - holding.cur[0]);
    active.set(e.pointerId, { kind: 'twist', drag: holding, ang0: ang, rot0: holding.token.rot || 0 });
    holding.twisted = true;
    return;
  }
  // Con le dita si possono sempre spostare gli omini; la Pencil disegna sopra di loro
  const canDrag = tool !== 'erase' && (tool === 'move' || e.pointerType !== 'pen');
  const tok = canDrag ? hitToken(sx, sy, e.pointerType === 'touch' ? 10 : 4) : null;
  if (tok) {
    const [wx, wy] = toWorld(sx, sy);
    active.set(e.pointerId, { kind: 'drag', token: tok, dx: tok.x - wx, dy: tok.y - wy, sx, sy, cur: [sx, sy], moved: false });
    requestDraw();
    return;
  }
  if (tool === 'move') return;
  if (tool === 'erase') {
    active.set(e.pointerId, { kind: 'erase', changed: eraseAt(sx, sy), last: [sx, sy] });
    requestDraw();
    return;
  }
  const [wx, wy] = toWorld(sx, sy);
  const w = SIZES[prefs.size] / S;
  active.set(e.pointerId, { kind: 'draw', stroke: { tool, color: prefs.color, w: +w.toFixed(4), pts: [[wx, wy]] } });
  requestDraw();
});

cv.addEventListener('pointermove', e => {
  const a = active.get(e.pointerId);
  if (!a) return;
  e.preventDefault();
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  const last = events.length ? events[events.length - 1] : e;
  const [sx, sy] = evPos(last);
  if (a.kind === 'twist') {
    const h = a.drag, ang = Math.atan2(sy - h.cur[1], sx - h.cur[0]);
    let r = a.rot0 + (ang - a.ang0) * 180 / Math.PI;
    r = ((r + 540) % 360) - 180;
    h.token.rot = Math.round(r);
    a.changed = true;
    requestDraw();
    return;
  }
  if (a.kind === 'drag') {
    a.cur = [sx, sy];
    if (Math.hypot(sx - a.sx, sy - a.sy) > 4) a.moved = true;
    const [wx, wy] = toWorld(sx, sy);
    [a.token.x, a.token.y] = clampWorld(wx + a.dx, wy + a.dy);
    const [tx, ty] = trashPos();
    a.overTrash = a.moved && Math.hypot(sx - tx, sy - ty) < 48;
  } else if (a.kind === 'draw') {
    const pts = a.stroke.pts;
    for (const ev of (events.length ? events : [e])) {
      const [px, py] = evPos(ev);
      const [wx, wy] = toWorld(px, py);
      const lp = pts[pts.length - 1];
      if (Math.hypot(wx - lp[0], wy - lp[1]) * S >= 2) pts.push([+wx.toFixed(3), +wy.toFixed(3)]);
    }
    if ((a.stroke.tool === 'arrow' || a.stroke.tool === 'dash') && pts.length > 2) pts.splice(1, pts.length - 2);
  } else if (a.kind === 'erase') {
    for (const ev of (events.length ? events : [e])) {
      const [px, py] = evPos(ev);
      // passi piccoli, cosi' anche un movimento veloce cancella tutta la scia
      const d = Math.hypot(px - a.last[0], py - a.last[1]), n = Math.max(1, Math.ceil(d / (ERASER_PX * 0.6)));
      for (let j = 1; j <= n; j++) if (eraseAt(a.last[0] + (px - a.last[0]) * j / n, a.last[1] + (py - a.last[1]) * j / n)) a.changed = true;
      a.last = [px, py];
    }
  }
  requestDraw();
});

function endPointer(e, cancelled) {
  const a = active.get(e.pointerId);
  if (!a) return;
  active.delete(e.pointerId);
  if (a.kind === 'twist') { if (a.changed) commit(); requestDraw(); return; }
  if (a.kind === 'drag') {
    if (a.moved && a.overTrash && !cancelled) {
      board.tokens = board.tokens.filter(t => t !== a.token);
      commit(); toast('Tolto (puoi annullare)');
    } else if (a.moved) commit();
    else if (!cancelled && !a.twisted && a.token.team !== 'ball') {
      const now = Date.now();
      if (lastTap.id === a.token.id && now - lastTap.time < 400) { lastTap = { id: null, time: 0 }; editLabel(a.token); }
      else lastTap = { id: a.token.id, time: now };

  } else if (a.kind === 'draw') {
    const s = a.stroke;
    const p0 = s.pts[0], p1 = s.pts[s.pts.length - 1];
    const long = Math.hypot((p1[0] - p0[0]) * S, (p1[1] - p0[1]) * S) > 8 || s.pts.length > 3;
    if (!cancelled && (long || s.tool === 'pen' || s.tool === 'hl')) { board.strokes.push(s); commit(); }
  } else if (a.kind === 'erase' && a.changed) commit();
  requestDraw();
}

function freeSpot(cx, cy) {
  // cerca un punto libero vicino al centro della meta' campo
  const cand = [[0, 0], [0, -1.6], [0, 1.6], [-1.4, 0], [1.4, 0], [-1.4, -1.6], [1.4, 1.6], [-1.4, 1.6], [1.4, -1.6], [0, -3.2], [0, 3.2]];
  for (const [dx, dy] of cand) {
    const x = cx + dx, y = cy + dy;
    if (!board.tokens.some(t => Math.abs(t.x - x) < 1.0 && Math.abs(t.y - y) < 1.4)) return [x, y];
  }
  return [cx + (Math.random() - 0.5), cy + (Math.random() - 0.5)];
}
function addToken(kind) {
  const id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  let tok;
  if (kind === 'ball') {
    const [x, y] = freeSpot(prefs.view === 'full' ? 9 - 1.2 : 4.5, 4.5);
    tok = { id, team: 'ball', label: '', x, y };
  } else {
    const team = kind === 'B' ? 'B' : 'A';
    const used = new Set(board.tokens.filter(t => t.team === team).map(t => t.label));
    let label = 'L';
    if (kind !== 'L') { let n = 1; while (used.has(String(n))) n++; label = String(n); }
    const [x, y] = freeSpot(team === 'A' ? 4.5 : 13.5, 4.5);
    tok = { id, team, label, x, y };
    if (kind === 'L') tok.lib = true;
  }
  board.tokens.push(tok);
  commit(); draw();
}

document.getElementById('zones').onclick = () => { prefs.zones = !prefs.zones; savePrefs(); updateButtons(); draw(); };

function updateButtons() {
  document.querySelectorAll('#tools [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === prefs.tool));
  let match = false;
  colorsEl.querySelectorAll('.sw[data-color]').forEach(b => { const on = b.dataset.color === prefs.color; b.classList.toggle('on', on); match = match || on; });
  custom.classList.toggle('on', !match);
  if (!match) custom.style.background = prefs.color;
  else custom.style.background = '';
  sizesEl.querySelectorAll('.size').forEach((b, i) => b.classList.toggle('on', i === prefs.size));
  document.getElementById('view').textContent = prefs.view === 'full' ? '½ campo' : 'Intero';
  document.getElementById('zones').classList.toggle('on', prefs.zones);
  document.getElementById('style').textContent = prefs.style === 'top' ? 'Vista: alto' : 'Vista: lato';
  document.querySelector('[data-add="B"]').disabled = prefs.view !== 'full';
  document.getElementById('undo').disabled = hIndex <= 0;
  document.getElementById('redo').disabled = hIndex >= history.length - 1;
}

let toastT = 0;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Avvio ----------
prefs = Object.assign(prefs, lsGet(LS_PREFS) || {});
try { localStorage.removeItem(LS_BOARD); } catch (e) { } // vecchie versioni la salvavano per sempre
const saved = ssGet(LS_BOARD);
board = saved && Array.isArray(saved.tokens) ? saved : defaultBoard();
for (const t of board.tokens) { // riporta dentro chi era rimasto fuori dal campo visibile
  t.x = Math.max(VIEWS.full.x0 + 0.3, Math.min(VIEWS.full.x1 - 0.3, t.x));
  t.y = Math.max(VIEWS.full.y0 + 0.3, Math.min(VIEWS.full.y1 - 0.3, t.y));
}
commit();
new ResizeObserver(layout).observe(document.getElementById('stage'));
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();
updateButtons();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
